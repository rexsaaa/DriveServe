[build-system]
requires = ["setuptools==75.1.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "driveserve"
version = "0.1.0.dev0"
description = "Evidence-driven inference experiments for a structured driving proxy task"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
driveserve = "driveserve.cli:main"

[tool.setuptools.packages.find]
include = ["driveserve*"]
